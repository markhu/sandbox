; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; NOTE: This is the M5Stack "Stamp-S3A" (with 3D antenna), SKU S007-V033 —
; NOT the plain "Stamp-S3" (no antenna). PlatformIO has no dedicated
; "m5stack-stamps3a" board profile, but the chip/pins are identical to
; m5stack-stamps3, so we reuse that board ID here.
;
; IMPORTANT HARDWARE DIFFERENCE: on the Stamp-S3A, the onboard WS2812 RGB
; LED's power rail is multiplexed with the reserved LCD backlight circuit
; and is NOT powered by default (unlike the plain Stamp-S3, where the LED
; is always powered). See src/main.cpp for the GPIO used to enable it.
[env:m5stamps3a]
platform = espressif32
board = m5stack-stamps3
framework = arduino
upload_port = /dev/cu.usbmodem11401
monitor_port = /dev/cu.usbmodem11401
monitor_speed = 115200
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=4
lib_deps = 
	fastled/FastLED@^3.10.3
	adafruit/Adafruit NeoPixel@^1.15.5
