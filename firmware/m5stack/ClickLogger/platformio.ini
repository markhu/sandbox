; PlatformIO Project Configuration File
; ClickLogger — detects solenoid "click" (open/close) acoustic events via the
; onboard PDM mic, timestamps them with the onboard RTC, and logs them to
; internal flash (SPIFFS) so the board can run untethered.

[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino

lib_deps =
    m5stack/M5StickCPlus

board_build.filesystem = spiffs

monitor_speed = 115200
upload_port = /dev/cu.usbserial-3552BBE64F
monitor_port = /dev/cu.usbserial-3552BBE64F
