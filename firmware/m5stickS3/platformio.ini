; PlatformIO project for M5Stack M5StickS3 (ESP32-S3, native USB)
; Board: M5StickS3 uses an ESP32-S3FN8 (8MB flash, no PSRAM), native USB-CDC.
; There is no dedicated PlatformIO board definition yet, so we base on the
; generic ESP32-S3-DevKitC-1 (N8, no PSRAM) profile and let M5Unified detect
; and configure the actual M5StickS3 hardware (LCD, IMU, battery, etc.) at
; runtime via M5.begin().

[env:m5stack-stickc-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Native USB-CDC console (M5StickS3 has no separate USB-UART bridge chip)
board_build.usb_mode = 1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    m5stack/M5Unified@^0.2.23

upload_protocol = esptool
